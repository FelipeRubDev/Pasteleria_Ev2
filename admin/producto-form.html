<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario Producto - Panel Administrador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a href="index.html" class="navbar-brand fw-bold">🧁 Panel Administración</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-admin">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu-admin">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio Panel</a></li>
          <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="../index.html">Ir a Tienda</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="flex-grow-1 d-flex align-items-center py-4">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="mb-1">Registrar Producto</h1>
              <p class="text-secondary mb-3">Ingresa los datos para agregar al catálogo general</p>

              <form id="form-admin-producto" onsubmit="return guardarProductoAdmin()">
                <div class="mb-3">
                  <label for="adm-code" class="form-label">Código Producto (* Mín 3 caracteres)</label>
                  <input type="text" class="form-control" id="adm-code" required minlength="3" placeholder="Ej: TC003">
                </div>

                <div class="mb-3">
                  <label for="adm-nombre" class="form-label">Nombre (* Máx 100 caracteres)</label>
                  <input type="text" class="form-control" id="adm-nombre" required maxlength="100">
                </div>

                <div class="mb-3">
                  <label for="adm-categoria" class="form-label">Categoría (*)</label>
                  <select class="form-select" id="adm-categoria" required>
                    <option value="Tortas Cuadradas">Tortas Cuadradas</option>
                    <option value="Tortas Circulares">Tortas Circulares</option>
                    <option value="Postres Individuales">Postres Individuales</option>
                    <option value="Productos Sin Azúcar">Productos Sin Azúcar</option>
                    <option value="Productos Vegana">Productos Vegana</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="adm-precio" class="form-label">Precio CLP (* Mínimo 0)</label>
                  <input type="number" class="form-control" id="adm-precio" required min="0" placeholder="Ej: 45000">
                </div>

                <div class="mb-3">
                  <label for="adm-stock" class="form-label">Stock Actual (*)</label>
                  <input type="number" class="form-control" id="adm-stock" required min="0" value="10">
                </div>

                <div class="mb-3">
                  <label for="adm-stock-critico" class="form-label">Stock Crítico (* Umbral de alerta)</label>
                  <input type="number" class="form-control" id="adm-stock-critico" required min="0" value="3">
                </div>

                <div class="mb-3">
                  <label for="adm-img" class="form-label">Imagen (ruta o URL) (*)</label>
                  <input type="text" class="form-control" id="adm-img" required placeholder="img/mi_producto.jpg" value="img/torta_cuadrada_choc.jpg">
                </div>

                <button type="submit" class="btn btn-primary w-100">Guardar Producto</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer-tienda">
    <p class="mb-0">&copy; 2026 Pastelería 1000 Sabores - Control Interno</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/script.js"></script>
</body>

</html>
