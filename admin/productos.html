<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Productos - Panel Administrador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a href="index.html" class="navbar-brand fw-bold">🧁 Panel Administración</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-admin">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu-admin">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio Panel</a></li>
          <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="../index.html">Ir a Tienda</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="flex-grow-1">
    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <div>
          <h1>Mantenedor de Productos</h1>
          <p id="mensaje-rol-usuario" class="text-secondary mb-0"></p>
        </div>
        <!-- Oculto para el Rol Vendedor -->
        <a href="producto-form.html" class="btn btn-primary solo-admin">+ Nuevo Producto</a>
      </div>

      <div class="card shadow-sm">
        <div class="card-body table-responsive">
          <table class="table table-bordered table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Estado de Stock</th>
                <th class="solo-admin">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-productos-admin">
              <!-- JS cargará aquí los productos y destacará el stock crítico -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer-tienda">
    <p class="mb-0">&copy; 2026 Pastelería 1000 Sabores - Control Interno</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/script.js"></script>
</body>

</html>
