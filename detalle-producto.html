<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Producto - Pastelería 1000 Sabores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a href="index.html" class="navbar-brand fw-bold">🧁 Pastelería 1000 Sabores</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principal">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu-principal">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
          <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
          <li class="nav-item"><a class="nav-link" href="ingreso.html">Ingresar</a></li>
          <li class="nav-item"><a class="nav-link" href="registro.html">Crear cuenta</a></li>
          <li class="nav-item"><a class="nav-link" href="carrito.html">🛒 Carrito (<span id="cart-count">0</span>)</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="flex-grow-1">
    <div class="container py-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="row g-4 align-items-center">

            <div class="col-md-6 text-center">
              <img id="prod-img" src="img/torta_cuadrada_choc.jpg" alt="Producto" class="imagen-detalle rounded shadow-sm">
            </div>

            <div class="col-md-6">
              <h1 id="prod-nombre" class="mb-2">Cargando...</h1>
              <p id="prod-precio" class="precio fs-3 mb-3">$0</p>
              <p id="prod-desc" class="text-secondary mb-4">Cargando descripción...</p>

              <div class="mb-3">
                <label for="prod-mensaje" class="form-label">Mensaje en la torta (Opcional):</label>
                <input type="text" class="form-control" id="prod-mensaje" placeholder="Ej: ¡Feliz Cumpleaños!" maxlength="50">
              </div>

              <div class="mb-4">
                <label for="prod-cantidad" class="form-label">Cantidad:</label>
                <input type="number" class="form-control w-auto" id="prod-cantidad" value="1" min="1" max="10">
              </div>

              <button id="btn-agregar-carrito" type="button" class="btn btn-primary btn-lg w-100">
                🛒 Añadir al Carrito
              </button>
            </div>

          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer-tienda">
    <p class="mb-1">Pastelería 1000 Sabores</p>
    <p class="mb-1">contacto@1000sabores.cl | +56 9 1234 5678</p>
    <p class="mb-0">&copy; 2026 Pastelería 1000 Sabores</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>

</html>
