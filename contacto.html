<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Pastelería 1000 Sabores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a href="index.html" class="navbar-brand fw-bold">🧁 Pastelería 1000 Sabores</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principal">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu-principal">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
          <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
          <li class="nav-item"><a class="nav-link" href="ingreso.html">Ingresar</a></li>
          <li class="nav-item"><a class="nav-link" href="registro.html">Crear cuenta</a></li>
          <li class="nav-item"><a class="nav-link" href="carrito.html">🛒 Carrito (<span id="cart-count">0</span>)</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="flex-grow-1 d-flex align-items-center py-4">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="mb-1">Formulario de Contacto</h1>
              <p class="text-secondary mb-3">Envíanos tus dudas o comentarios</p>

              <form id="form-contacto" onsubmit="return validarContacto()">
                <div class="mb-3">
                  <label for="cnt-nombre" class="form-label">Nombre completo (*)</label>
                  <input type="text" class="form-control" id="cnt-nombre" maxlength="100" required>
                </div>

                <div class="mb-3">
                  <label for="cnt-correo" class="form-label">Correo electrónico (*)</label>
                  <input type="email" class="form-control" id="cnt-correo" maxlength="100" placeholder="ejemplo@duoc.cl" required>
                </div>

                <div class="mb-3">
                  <label for="cnt-comentario" class="form-label">Comentario (*)</label>
                  <textarea class="form-control" id="cnt-comentario" rows="5" maxlength="500" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100">Enviar Mensaje</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer-tienda">
    <p class="mb-1">Pastelería 1000 Sabores</p>
    <p class="mb-1">contacto@1000sabores.cl | +56 9 1234 5678</p>
    <p class="mb-0">&copy; 2026 Pastelería 1000 Sabores</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>

</html>
